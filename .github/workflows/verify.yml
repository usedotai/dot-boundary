name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check committed benchmark evidence
        run: |
          npm run evidence
          node benchmarks/reference/check.mjs
      - run: npm run verify
      - run: npm pack --dry-run
      - run: git diff --check
  reference-correctness:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: google-research/camel-prompt-injection
          ref: f083b6b396399d3b3c7f2ddaf613a5945eaf32d8
          path: .reference/camel
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.12'
      - run: python -m pip install --target .reference/deps --no-compile --no-cache-dir -r benchmarks/reference/reference-requirements.txt
      - name: Compare generated decisions and published trace replay
        run: python benchmarks/reference/run.py --correctness-only
